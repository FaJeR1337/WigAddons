name: Release

# Pushing a tag like v1.0.0, or running this by hand with a tag, publishes a release with the jars in downloads/ attached.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, like v1.0.0 (created if it doesn't exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" downloads/*.jar --target "$GITHUB_SHA" \
            --title "WigAddons ${TAG#v}" \
            --notes "wigaddons-26.1.2.jar is for Minecraft 26.1.2 (Fabric API 0.155.3+26.1.2) and wigaddons-26.2.jar is for Minecraft 26.2 (Fabric API 0.161.0+26.2)."

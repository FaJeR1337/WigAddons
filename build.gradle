plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The Minecraft version to build for: -Ptarget=26.1.2 (the default) or -Ptarget=26.2, each with its settings in versions/<target>.properties
def target = findProperty('target') ?: '26.1.2'
def vp = new Properties()
file("versions/${target}.properties").withInputStream { vp.load(it) }

loom {
	splitEnvironmentSourceSets()

	mods {
		"wigaddons" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// the few calls that differ between game versions live in src/compat/<target>
sourceSets.client.java.srcDir "src/compat/${target}/java"

repositories {
	maven {
		name = 'NotEnoughUpdates'
		url = 'https://maven.notenoughupdates.org/releases'
		content {
			includeGroup 'org.notenoughupdates.moulconfig'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${vp.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${vp.fabric_api_version}"

	// The settings screen: MoulConfig (LGPL-3.0), and the Kotlin runtime it needs, both bundled into the mod jar.
	implementation "org.notenoughupdates.moulconfig:${vp.moulconfig_artifact}:${vp.moulconfig_version}"
	include "org.notenoughupdates.moulconfig:${vp.moulconfig_artifact}:${vp.moulconfig_version}"
	implementation "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
	include "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "minecraft", vp.minecraft_range

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft": vp.minecraft_range
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// the jars are named after the game version, not the mod's: wigaddons-26.1.2.jar, wigaddons-26.2.jar
jar {
	archiveFileName = "wigaddons-${target}.jar"
	def projectName = project.name
	inputs.property "projectName", projectName

	from("../LICENSE") {
		rename { "${it}_$projectName"}
	}
}

test {
	useJUnitPlatform()
}
